<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title><ui:insert name="title">Clinical Portal (demo)</ui:insert></title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <h:outputStylesheet name="css/app.css"/>
</h:head>
<h:body>
    <div class="app-shell">
        <header class="app-header">
            <span class="app-title">Clinical Portal <span class="app-badge">demo</span></span>
            <h:form id="sessionForm" rendered="#{sessionUser.loggedIn}" styleClass="app-session">
                <span class="app-user">#{sessionUser.username}</span>
                <p:commandButton value="Sign out" action="#{loginBean.logout}" ajax="false"
                                 styleClass="ui-button-flat"/>
            </h:form>
        </header>

        <ui:fragment rendered="#{sessionUser.loggedIn}">
            <nav class="app-nav">
                <p:link outcome="/secure/discharges.xhtml" value="Discharges"/>
                <p:link outcome="/secure/discharge.xhtml" value="New discharge"/>
            </nav>
        </ui:fragment>

        <main class="app-main">
            <p:messages id="messages" showDetail="true" closable="true"/>
            <ui:insert name="content"/>
        </main>

        <footer class="app-footer">
            jboss-prometheus-grafana &#183; generic reference implementation
        </footer>
    </div>
</h:body>
</html>
