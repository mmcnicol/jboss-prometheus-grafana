# Observability stack for the demo VM.
#
#   always-on:   docker compose -f observability/docker-compose.yml up -d
#                (Prometheus + Grafana)
#
#   during a load-test run (adds the collector, scoped to the run):
#                RUN_ID=... RELEASE=... TEST_TYPE=ui \
#                docker compose -f observability/docker-compose.yml --profile loadtest up -d otel-collector
#                ... run the scenario ...
#                docker compose -f observability/docker-compose.yml --profile loadtest down
#
# Prometheus and the collector stay on the VM's localhost; only Grafana (3000)
# is exposed, and the firewall limits that to the operator IP.

name: jpg-observability

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # Started only for the duration of a load-test run (profile: loadtest).
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    profiles: ["loadtest"]
    restart: "no"
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      RUN_ID: ${RUN_ID:-adhoc}
      RELEASE: ${RELEASE:-unknown}
      TEST_TYPE: ${TEST_TYPE:-ui}
      ENV: ${ENV:-dev}
      SCRAPE_TARGET: ${SCRAPE_TARGET:-localhost:8080}
      SCRAPE_METRICS_PATH: ${SCRAPE_METRICS_PATH:-/portal-web/metrics}
      PROM_RW_ENDPOINT: ${PROM_RW_ENDPOINT:-http://localhost:9090/api/v1/write}
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    # host networking so the collector reaches WildFly (:8080) and Prometheus
    # (:9090) on the VM's loopback with no extra plumbing.
    network_mode: "host"

volumes:
  prometheus-data:
  grafana-data:
