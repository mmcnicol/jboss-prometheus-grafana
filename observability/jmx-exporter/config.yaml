# jmx_exporter javaagent config — the Spike E ALTERNATIVE to the WildFly
# MicroProfile Metrics subsystem. Use this when: not on WildFly/EAP, the
# management port can't be reached, or you want vendor-neutral metric names.
#
# Enable:  ./scripts/on-vm-jmx-agent.sh on     (adds -javaagent + restarts WildFly)
# Serves http://<host>:9404/metrics ; keep that port internal (NFR7).
#
# Minimal, version-robust: export the JVM + Undertow MBeans and let the default
# naming apply. Tighten with `rules:` once you know which metrics you want.

lowercaseOutputName: true
lowercaseOutputLabelNames: true

rules:
  # JVM memory (heap / non-heap)
  - pattern: 'java.lang<type=Memory><(HeapMemoryUsage|NonHeapMemoryUsage)>(\w+)'
    name: jvm_memory_$1_$2_bytes
    type: GAUGE
  # GC
  - pattern: 'java.lang<type=GarbageCollector, name=(.+)><>(CollectionCount|CollectionTime)'
    name: jvm_gc_$2
    labels: { gc: "$1" }
    type: COUNTER
  # Threads / classes / CPU
  - pattern: 'java.lang<type=Threading><>(ThreadCount|DaemonThreadCount|PeakThreadCount)'
    name: jvm_threads_$1
    type: GAUGE
  - pattern: 'java.lang<type=ClassLoading><>(LoadedClassCount|TotalLoadedClassCount)'
    name: jvm_classes_$1
    type: GAUGE
  - pattern: 'java.lang<type=OperatingSystem><>(ProcessCpuLoad|SystemLoadAverage|OpenFileDescriptorCount)'
    name: process_$1
    type: GAUGE
  # Undertow HTTP listener stats (needs statistics-enabled=true on the subsystem)
  - pattern: 'jboss.as<subsystem=undertow, server=(.+), (http|https)-listener=(.+)><>(requestCount|bytesSent|bytesReceived|errorCount|processingTime)'
    name: undertow_$4
    labels: { server: "$1", listener: "$3" }
  # Drop everything else
