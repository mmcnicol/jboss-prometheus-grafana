# OpenTelemetry Collector — load-test run pipeline.
#
# Lifetime = one load-test run. Started with the run's identity in the
# environment; scrapes the app's Prometheus endpoint, stamps every sample with
# the run labels, and remote-writes to Prometheus.
#
# Phase 0: the app has no /metrics endpoint yet (no backend), so this scrapes
# nothing useful — it is wired and ready for Phase 1.

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: portal-web
          scrape_interval: 5s
          metrics_path: /portal-web/metrics
          static_configs:
            - targets: ["${env:SCRAPE_HOST}"]
        - job_name: service-a
          scrape_interval: 5s
          metrics_path: /service-a/metrics
          static_configs:
            - targets: ["${env:SCRAPE_HOST}"]
        - job_name: service-b
          scrape_interval: 5s
          metrics_path: /service-b/metrics
          static_configs:
            - targets: ["${env:SCRAPE_HOST}"]

processors:
  batch:
    timeout: 5s
  resource:
    attributes:
      - key: run_id
        value: ${env:RUN_ID}
        action: upsert
      - key: release
        value: ${env:RELEASE}
        action: upsert
      - key: test_type
        value: ${env:TEST_TYPE}
        action: upsert
      - key: env
        value: ${env:ENV}
        action: upsert
      # Drop the scrape-transport resource attributes the Prometheus receiver
      # adds, so they don't become series labels. Keep job/instance/service.name.
      - key: http.scheme
        action: delete
      - key: url.scheme
        action: delete
      - key: net.host.port
        action: delete
      - key: server.port
        action: delete

exporters:
  prometheusremotewrite:
    endpoint: ${env:PROM_RW_ENDPOINT}
    resource_to_telemetry_conversion:
      enabled: true   # turn run_id/release/... resource attrs into series labels
  debug:
    verbosity: normal

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resource, batch]
      exporters: [prometheusremotewrite, debug]
